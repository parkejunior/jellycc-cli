# Jellyfin Codec Support Matrix
# Reference: https://jellyfin.org/docs/general/clients/codec-support/

metadata:
  version: "1.1"
  description: "Matriz de compatibilidade para verificação de Direct Play vs Transcoding"

clients:
  chrome:
    video:
      mpeg4_part2_sp: false
      mpeg4_part2_asp: false
      h264_8bit: true
      h264_10bit: true
      hevc_8bit: "mx_chrome_hevc"
      hevc_10bit: "mx_chrome_hevc"
      vp9: true
      av1: true
    audio:
      flac: true
      mp3: "mx_mp3_mono"
      aac: true
      ac3: true
      eac3: true
      vorbis: true
      dts: false
      opus: true
      alac: false
    containers:
      mp4: true
      mkv: "mx_chrome_mkv"
      webm: true
      ts: true
      ogg: true

